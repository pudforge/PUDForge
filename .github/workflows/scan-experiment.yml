name: Scan experiment

# Builds the client several different ways and keeps each exe, so they can be
# put in front of VirusTotal side by side. Nothing here releases anything.
#
# Why: from 0.1.69 on, every release came back Trojan:Win32/Wacatac.B!ml
# from Microsoft's machine-learning engine and nothing else. This built the
# same source with MSVC 14.29, 14.41 and 14.44, at /O1, /O2 and with LTCG,
# and with GCC, five times over for the default: 18 of 22 runner builds were
# flagged, and two builds that differed only in their four timestamp bytes
# went different ways. The verdict is a threshold, not a feature, and no
# toolset or flag moves it. docs/releasing.md has the table. Kept so the
# next question can be asked the same way; scripts/vt-check.ps1 is the
# other half.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/scan-experiment.yml

jobs:
  msvc-1441:
    name: msvc-14.41-${{ matrix.repeat }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        repeat: [a, b, c]
    steps:
      - uses: actions/checkout@v5
      # The runner ships 14.44 and 14.29. 14.41 is the toolset the clean
      # desktop build used, and the installer can add it in a few minutes.
      - name: Install the 14.41 toolset
        shell: pwsh
        run: |
          $setup = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe'
          $vs = (& 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe' -latest -property installationPath)
          Start-Process -FilePath $setup -Wait -ArgumentList @(
            'modify', '--installPath', "`"$vs`"",
            '--add', 'Microsoft.VisualStudio.Component.VC.14.41.17.11.x86.x64',
            '--quiet', '--norestart', '--nocache')
          Get-ChildItem "$vs\VC\Tools\MSVC" | Select-Object -ExpandProperty Name
      - name: Configure
        run: cmake -S src -B build -DCMAKE_BUILD_TYPE=Release -T version=14.41
      - name: Build
        run: cmake --build build --config Release --target PUDForgeWin
      - uses: actions/upload-artifact@v7
        with:
          name: exp-msvc1441-${{ matrix.repeat }}
          path: build/Release/PUDForge.exe
          retention-days: 7

  mingw:
    name: mingw-${{ matrix.name }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: O2
            flags: "-D_WIN32_WINNT=0x0A00"
            link: ""
          - name: Os-stripped
            flags: "-D_WIN32_WINNT=0x0A00 -Os"
            link: "-s"
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - name: Configure
        # MinGW's headers hide GetDpiForWindow behind a Windows 10 target.
        run: cmake -S src -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}" "-DCMAKE_C_FLAGS=${{ matrix.flags }}" "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.link }}"
      - name: Build
        run: cmake --build build --target PUDForgeWin
      - uses: actions/upload-artifact@v7
        with:
          name: exp-mingw-${{ matrix.name }}
          path: build/PUDForge.exe
          retention-days: 7

name: CI

# Windows only. The client is the product and it is the one target that cannot
# be built anywhere else, so a green run here is the thing worth having.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# contents: write creates the tag and uploads to the release. actions: read is
# what the SignPath connector needs to read this run and fetch the artifact it
# is asked to sign. Naming any permission drops every permission not named, so
# the second one has to be written down rather than inherited.
permissions:
  contents: write
  actions: read

jobs:
  build:
    name: windows-2022
    # Pinned rather than latest so the toolset is the one the desktop builds
    # use. It is not a fix for the scanner verdict: docs/releasing.md has
    # the measurements, and no toolset or flag moved it.
    runs-on: windows-2022
    # Lifted out of the secrets context so a step condition can ask whether
    # signing is configured at all: `if:` can read env and cannot read secrets.
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S src -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      # Every run keeps its exe for a week, release or not, so a build can be
      # put in front of a scanner before it is a release rather than after.
      - name: Keep the build
        uses: actions/upload-artifact@v7
        with:
          name: PUDForge-build
          path: build/Release/PUDForge.exe
          retention-days: 7

      # Through CTest rather than the binary directly: each group is its own
      # job, so a failure names the group instead of burying it in one log.
      - name: Test
        run: ctest --test-dir build -C Release -j4 --output-on-failure

      # The version the binary already carries, rather than a second one kept
      # here: version.h feeds the title bar, About, --version and the
      # VERSIONINFO block Explorer reads, and a release tagged anything else
      # would be a release nobody could identify from the exe.
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $file = 'src/PUDForgeWin/version.h'
          $match = Select-String -Path $file -Pattern '#define PF_APP_VERSION_STR\s+"([^"]+)"'
          if (-not $match) { throw "no PF_APP_VERSION_STR in $file" }
          $version = $match.Matches[0].Groups[1].Value
          # Asked of the remote rather than of the checkout: actions/checkout
          # fetches no tags, so a local `git tag -l` would call every version new
          # and every run would try to release.
          $existing = git ls-remote --tags origin "refs/tags/v$version"
          $isNew = [string]::IsNullOrWhiteSpace($existing)
          # Whether this run releases, answered once. Three steps below need it
          # — upload, sign, publish — and three copies of the condition would be
          # three chances to change two of them.
          $release = $isNew -and
                     ('${{ github.event_name }}' -eq 'push') -and
                     ('${{ github.ref }}' -eq 'refs/heads/master')
          "version=$version"  | Out-File $env:GITHUB_OUTPUT -Append
          "is_new=$($isNew.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append
          "release=$($release.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append
          if ($isNew) {
            "v$version is new - this run will release it"
          } else {
            "v$version is already released - bump version.h to cut another"
          }

      # ----------------------------------------------------------- signing
      #
      # Signed by SignPath Foundation, which signs open source for free. The
      # point is not the padlock. Windows attaches reputation to the *signer*,
      # and that outlives any single build, so a signed release inherits what
      # every release before it earned. Unsigned, every release is a file the
      # world has never seen before, which is why a browser calls it a virus.
      #
      # SignPath will not take the binary handed to it. It reads the artifact
      # back out of this workflow run through GitHub's own API, so what gets
      # signed is provably what this run built rather than whatever the holder
      # of the API token chose to upload. That round trip is the reason the exe
      # is uploaded as an artifact before it is signed, and the reason the
      # upload has to happen in the same run.
      - name: Upload the unsigned exe for signing
        id: unsigned
        if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: PUDForge-unsigned
          path: build/Release/PUDForge.exe

      # Skipped rather than failed when SignPath is not configured. The token
      # is the one part that cannot be committed, so its absence is exactly
      # what "not set up yet" looks like, and holding a release back over it
      # would help nobody. The Release step says out loud which way it went, so
      # an unsigned release cannot pass quietly for a signed one.
      - name: Sign
        id: sign
        if: >-
          steps.version.outputs.release == 'true' &&
          env.SIGNPATH_API_TOKEN != '' &&
          vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # Only from master, and only once per version. version.h asks for a patch
      # bump on every commit, so a commit that bumps it ships and a commit that
      # does not just builds — rather than failing on a tag that already exists.
      - name: Release
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          # The signed file when signing ran, the build output when it did not.
          # Which of the two it is decides what is uploaded *and* what the notes
          # say about it: an unsigned release described as a signed one is the
          # single thing here worth never shipping.
          $exe = 'signed/PUDForge.exe'
          $signed = Test-Path $exe
          if ($signed) {
            "signed: releasing $exe"
          } else {
            $exe = 'build/Release/PUDForge.exe'
            "NOT SIGNED: no SignPath configuration in this repository - releasing the build output as it is"
          }
          # The notes are CHANGELOG.md's section for this version, verbatim:
          # the words somebody wrote while making the change are better than
          # anything generated here, and having one place to write them is why
          # the file exists. A version with no section still ships - a release
          # held back over a missing heading helps nobody - it just carries the
          # standing text alone.
          # Read through .NET, so the em dashes in it survive whatever the
          # runner's default codepage turns out to be.
          $lines = [System.IO.File]::ReadAllLines((Resolve-Path CHANGELOG.md))
          $from = ($lines | Select-String -Pattern "^## $([regex]::Escape($v))\s*$" |
                   Select-Object -First 1).LineNumber
          $body = ''
          if ($from) {
            $rest = $lines[$from..($lines.Count - 1)]
            $next = ($rest | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
            $section = if ($next) { $rest[0..($next - 2)] } else { $rest }
            $body = ($section -join "`n").Trim()
            "release notes: $($section.Count) lines from CHANGELOG.md"
          } else {
            "no '## $v' section in CHANGELOG.md - shipping the standing text alone"
          }
          # The hash of the exact file about to be uploaded, published beside
          # it. Taken after signing rather than before, because signing rewrites
          # the file and a hash of the unsigned one would match nothing anybody
          # can download.
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          # Assembled outside the array below: a backtick inside a
          # double-quoted PowerShell string is an escape character, and one
          # markdown code span is not worth two levels of quoting.
          $shaLine = '- SHA-256 `' + $sha + '`'
          # What is true of every release, under whatever this one changed.
          # Built as an array rather than a here-string: a PowerShell
          # here-string wants its closing '@ in column 0, which is not
          # something a YAML block scalar can promise.
          $standing = @(
            'A Warcraft II map editor for Windows.',
            '',
            '`PUDForge.exe` is the whole download. It is statically linked, so',
            'there is no Visual C++ redistributable to install, and everything',
            'the window needs - icons, strings, the user guide - is inside it.',
            '',
            'It does need a Warcraft II install for the tilesets, sprites and',
            "portraits: that data is Blizzard's and is not redistributable, so",
            'it is not here. Either Battle.net Edition or Warcraft II',
            'Remastered works, and dropping the exe into the game folder is',
            'enough.',
            '',
            'A copy you already have installs this release itself, from Help,',
            'Check for Updates.',
            ''
          )
          # Only one of these is ever true, so only one is ever said. An
          # unsigned release used to carry a page about false positives here;
          # it read as a warning label, so now it carries the hash and nothing
          # else. docs/releasing.md keeps the explanation for whoever asks.
          $trust = if ($signed) {
            @(
              '### Checking the download',
              '',
              'The exe is signed by SignPath Foundation, which gives open',
              'source projects free code signing. Windows shows the publisher',
              'in the file properties and in any prompt about running it, so',
              'a copy that came from somewhere else is one you can tell apart.',
              '',
              $shaLine
            )
          } else {
            @(
              '### Checking the download',
              '',
              $shaLine
            )
          }
          $notes = ($standing + $trust) -join "`n"
          if ($body) { $notes = "$body`n`n---`n`n$notes" }
          # PUDForgeTest.exe is deliberately not uploaded: it is a byte copy of
          # the same binary under a second name, for running the editor while
          # still being able to relink it. Shipping it suggests two programs.
          gh release create "v$v" $exe `
            --title "PUDForge $v" --notes $notes
